<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SlimShadey</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-root">
      <header class="app-header">
        <h1 class="app-title">SlimShadey</h1>
        <button id="startBtn" class="start-btn">Open file</button>
        <button id="useExamplesBtn" class="start-btn examples-btn">Use examples</button>
        <input type="file" id="fileInput" accept=".fasta,.fa,.txt,.mm" style="display: none" />
      </header>

      <div class="tab-bar" id="tabBar"></div>
      <div class="tab-panels" id="tabPanels"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
